name: App offline validation
on:
  pull_request:
    paths:
      - 'app/field-manager/**'
      - 'app/owner-app/**'
      - 'app/dealer/**'
      - 'app/middleman/**'
      - 'app/api/app-offline/**'
      - 'components/AppOfflineEntry.tsx'
      - 'database/migrations/109-app-offline-work.sql'
      - 'lib/app-offline*.ts'
      - 'lib/offline-mutation-queue.ts'
      - 'lib/asset-maintenance.ts'
      - 'lib/fuel-ledger.ts'
      - 'public/app-offline/**'
      - 'public/owner-app/**'
      - 'public/dealer/**'
      - 'public/middleman/**'
      - 'public/*-sw.js'
      - 'tests/app-offline.test.cjs'
      - 'tests/offline-maintenance-retry.test.cjs'
      - 'scripts/verify-app-offline.cjs'
      - 'app/api/field-manager/offline/**'
      - 'lib/field-manager*.ts'
      - 'public/field-manager/**'
      - 'public/field-manager-sw.js'
      - 'tests/field-manager-offline.test.cjs'
      - 'scripts/verify-field-manager-offline.cjs'
      - '.github/workflows/field-manager-offline-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/app-offline.test.cjs tests/offline-maintenance-retry.test.cjs tests/field-manager-offline.test.cjs tests/app-account-isolation.test.mjs tests/separate-app-sessions.test.mjs
      - run: node scripts/verify-field-manager-offline.cjs
      - run: node scripts/verify-app-offline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-manager-offline-browser
          path: |
            .next/field-offline-validation
            .next/app-offline-validation
          if-no-files-found: ignore
