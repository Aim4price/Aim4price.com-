name: Billing validation
on:
  pull_request:
    paths:
      - 'lib/billing*'
      - 'lib/notifications.ts'
      - 'lib/notification-inbox.ts'
      - 'lib/owner-notification-inbox.ts'
      - 'lib/email.ts'
      - 'lib/email-brand.ts'
      - 'components/InvoicePreview*'
      - 'components/BillingInvoiceCard*'
      - 'components/InlineBillingInvoice*'
      - 'app/pending-payment/**'
      - 'app/account/account-invoices.tsx'
      - 'app/account/account-modal-scroller.tsx'
      - 'lib/account-profile.ts'
      - 'lib/admin-users.ts'
      - 'app/**/billing/**'
      - 'app/auth/**'
      - 'app/api/auth/**'
      - 'lib/auth.ts'
      - 'lib/signup-workspace-context.ts'
      - 'lib/report-theme.ts'
      - 'lib/report-pdf.ts'
      - 'tests/billing*'
      - 'scripts/verify-billing-report.cjs'
      - 'scripts/verify-billing-experience.cjs'
      - 'scripts/verify-admin-review.cjs'
      - 'database/migrations/110-aim4price-billing.sql'
      - 'database/migrations/116-billing-suspension.sql'
      - 'database/migrations/117-billing-hard-delete.sql'
      - '.github/workflows/billing-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/billing*.test.mjs tests/signup-wizard-flow.test.mjs
      - run: node scripts/verify-billing-report.cjs
      - run: node scripts/verify-admin-review.cjs
      - run: node scripts/verify-billing-experience.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-review-evidence
          path: |
            .next/billing-validation/
            .next/billing-experience-validation/
            .next/admin-review-validation/
