name: Account dialog consistency validation
on:
  pull_request:
    paths:
      - 'components/AccountDialog.module.css'
      - 'components/Dealer*'
      - 'components/MiddlemanShowroomClient*'
      - 'app/leads/**'
      - 'app/asset-discovery/**'
      - 'tests/fixtures/account-dialog*'
      - 'scripts/verify-account-dialogs.cjs'
      - '.github/workflows/account-dialog-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-dialogs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/dealer-app-maintenance-ui-refinement.test.mjs tests/dealer-maintenance-tracker-ui.test.mjs
      - name: Dealer scheduling flow regression
        run: node --test --test-name-pattern="dealer proposal wizard" tests/dealer-maintenance-schedule-proposals.test.mjs
      - run: node scripts/verify-account-dialogs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-dialog-screenshots
          path: .next/account-dialog-validation
