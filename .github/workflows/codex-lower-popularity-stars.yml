name: Popularity star alignment fix

on:
  push:
    branches:
      - codex/lower-popularity-stars-20260905

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/lower-popularity-stars-20260905
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply popularity star alignment
        run: python .github/codex-lower-popularity-stars.py

      - name: Validate diff
        run: git diff --check

      - name: Verify targeted alignment
        run: |
          grep -A10 '^\.popularityModalStarButton {' app/valuation/page.module.css | grep -q 'align-content: end;'
          grep -A10 '^\.popularityModalStarButton {' app/valuation/page.module.css | grep -q 'padding: 0.25rem 0.5rem 0.18rem;'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Basic Estimate regressions
        run: node --experimental-strip-types --test tests/basic-estimate-flow.test.mjs tests/mobile-valuation-flow.test.mjs

      - name: Production build compile validation
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/aim4price-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi

          if grep -Fq "✓ Compiled successfully" /tmp/aim4price-build.log \
            && grep -Fq "Database connection variables are missing" /tmp/aim4price-build.log \
            && grep -Fq "Failed to collect page data for /api/dealer/session" /tmp/aim4price-build.log; then
            echo "Production bundle compiled successfully; page-data collection requires database credentials that are unavailable in PR CI."
            exit 0
          fi

          exit "$build_status"

      - name: Commit final implementation
        shell: bash
        run: |
          rm .github/codex-lower-popularity-stars.py
          rm .github/workflows/codex-lower-popularity-stars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lower popularity stars in rating modal"
          git push origin HEAD:codex/lower-popularity-stars-20260905
