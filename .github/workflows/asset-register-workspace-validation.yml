name: Canonical website canvas validation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/website-canvas.ts"
      - "lib/dropdown-overlay-position.ts"
      - "lib/estimate-report-enhancement.ts"
      - "next.config.mjs"
      - "tests/**"
      - "scripts/verify-website-canvas.cjs"
      - ".github/workflows/asset-register-workspace-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Canonical layout, overlays and native boundaries
        run: node --experimental-strip-types --test tests/site-workspace-zoom.test.mjs tests/responsive-foundation.test.mjs tests/desktop-site-viewport.test.mjs tests/dropdown-overlay.test.mjs tests/compact-desktop-continuity.test.mjs tests/homepage-asset-register-hero.test.mjs tests/estimate-report-enhancement.test.mjs
      - name: Approved report design contract
        run: npm run test:report-design
      - name: Shared workflow regression tests
        run: |
          npm run test:asset-card-ui
          npm run test:umbrella-modal-design
          npm run test:signup-flow
          npm run test:account-app-access
          npm run test:owner-app-operations
          npm run test:dealer-fast-loading
          npm run test:app-umbrella-access
      - name: Production bundle validation
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/website-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -eq 0 ]; then exit 0; fi
          # Dealer routes are collected in parallel, so the first route to report
          # missing CI database credentials varies. Accept only that known
          # post-compilation stop; compile, type and bundle failures stay fatal.
          if grep -Fq "✓ Compiled successfully" /tmp/website-build.log \
            && grep -Fq "Database connection variables are missing" /tmp/website-build.log \
            && grep -Fq "Collecting page data" /tmp/website-build.log \
            && grep -Eq "Failed to collect page data for /api/dealer/[^[:space:]]+" /tmp/website-build.log; then
            echo "Bundle compiled; page-data collection requires deployment database credentials."
            exit 0
          fi
          exit "$build_status"
      - name: Browser scale, interaction and mobile isolation checks
        run: node scripts/verify-website-canvas.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-canvas-browser-evidence
          path: .next/canvas-validation
