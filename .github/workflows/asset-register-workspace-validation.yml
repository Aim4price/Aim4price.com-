name: Site workspace zoom validation

on:
  pull_request:
    paths:
      - "app/layout.tsx"
      - "app/compact-desktop-continuity.css"
      - "app/header-foundation.css"
      - "components/SiteWorkspaceZoom.tsx"
      - "components/SiteWorkspaceZoom.module.css"
      - "components/AppHeader.tsx"
      - "tests/site-workspace-zoom.test.mjs"
      - "tests/compact-desktop-continuity.test.mjs"
      - "tests/header-foundation.test.mjs"
      - ".github/workflows/asset-register-workspace-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-workspace-zoom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test shared zoom, Home continuity and header foundation
        run: node --test tests/site-workspace-zoom.test.mjs tests/compact-desktop-continuity.test.mjs tests/header-foundation.test.mjs
