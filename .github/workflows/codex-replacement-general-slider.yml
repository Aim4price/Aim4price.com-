name: Codex replacement general slider

on:
  push:
    branches:
      - codex/replacement-general-slider

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/replacement-general-slider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply replacement slider patch
        run: python .github/codex-replacement-patch.py

      - name: Validate diff
        run: git diff --check

      - run: npm ci
      - run: npm run typecheck

      - name: Focused regression tests
        run: node --experimental-strip-types --test tests/basic-estimate-flow.test.mjs tests/mobile-valuation-flow.test.mjs

      - name: Commit final implementation
        shell: bash
        run: |
          rm .github/workflows/codex-replacement-general-slider.yml
          rm .github/codex-replacement-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add general replacement price slider"
          git push origin HEAD:codex/replacement-general-slider
