name: Quick valuation validation

on:
  pull_request:
    paths:
      - "app/valuation/**"
      - "app/dealer/valuation/page.tsx"
      - "app/owner-app/valuation/page.tsx"
      - "lib/server-valuation.ts"
      - "tests/quick-valuation-flow.test.mjs"
      - "tests/mobile-valuation-flow.test.mjs"
      - "tests/dealer-client-asset-register-flow.test.mjs"
      - "tests/valuation-rules.test.mjs"
      - ".github/workflows/quick-valuation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-valuation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test Quick Estimate contract
        run: node --test tests/quick-valuation-flow.test.mjs

      - name: Test mobile valuation compatibility
        run: node --test tests/mobile-valuation-flow.test.mjs

      - name: Test Dealer client-register compatibility
        run: node --test tests/dealer-client-asset-register-flow.test.mjs

      - name: Test valuation rules compatibility
        run: node --test tests/valuation-rules.test.mjs

      - name: Production build compile validation
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/aim4price-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi

          # The repository's production build collects server-route page data and
          # therefore needs the live PG* connection variables after compilation.
          # In PR CI those credentials are intentionally absent. Only accept that
          # known post-compilation stop; every compile/type/bundle failure remains fatal.
          if grep -Fq "✓ Compiled successfully" /tmp/aim4price-build.log \
            && grep -Fq "Database connection variables are missing" /tmp/aim4price-build.log \
            && grep -Fq "Failed to collect page data for /api/dealer/session" /tmp/aim4price-build.log; then
            echo "Production bundle compiled successfully; page-data collection requires database credentials that are not available in PR CI."
            exit 0
          fi

          exit "$build_status"
