name: Quick valuation validation

on:
  pull_request:
    paths:
      - "app/valuation/**"
      - "app/dealer/valuation/page.tsx"
      - "app/owner-app/valuation/page.tsx"
      - "lib/server-valuation.ts"
      - "tests/quick-valuation-flow.test.mjs"
      - "tests/mobile-valuation-flow.test.mjs"
      - "tests/dealer-client-asset-register-flow.test.mjs"
      - "tests/accountant-workspace.security.test.mjs"
      - "tests/valuation-rules.test.mjs"
      - ".github/workflows/quick-valuation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-valuation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test quick valuation and compatibility contracts
        run: >-
          node --test
          tests/quick-valuation-flow.test.mjs
          tests/mobile-valuation-flow.test.mjs
          tests/dealer-client-asset-register-flow.test.mjs
          tests/accountant-workspace.security.test.mjs
          tests/valuation-rules.test.mjs
