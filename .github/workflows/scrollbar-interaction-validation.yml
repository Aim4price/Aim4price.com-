name: Scrollbar interaction validation

on:
  pull_request:
    paths:
      - 'app/layout.tsx'
      - 'components/ScrollbarInteractionGuard.tsx'
      - 'lib/scrollbar-interaction.ts'
      - 'scripts/verify-scrollbar-dismiss.cjs'
      - '.github/workflows/scrollbar-interaction-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-scrollbar-dismiss.cjs
