name: Temporary two-stage extras patch

on:
  push:
    branches:
      - codex/two-stage-extras-chooser-20260907

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply two-stage extras chooser
        run: python scripts/tmp-patch-two-stage-extras.py

      - name: Install dependencies
        run: npm ci

      - name: Run Basic Estimate regression
        run: node --experimental-strip-types --test tests/basic-estimate-flow.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet -- app/valuation/valuation-client.tsx tests/basic-estimate-flow.test.mjs; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/valuation/valuation-client.tsx tests/basic-estimate-flow.test.mjs
          git commit -m "Make Extras a two-stage chooser"
          git push origin HEAD:codex/two-stage-extras-chooser-20260907
