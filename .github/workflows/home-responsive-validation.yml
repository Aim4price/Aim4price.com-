name: Home responsive validation

on:
  pull_request:
    paths:
      - "app/page.tsx"
      - "app/page.module.css"
      - "app/home-wide-static.css"
      - "app/home-hero-experience.tsx"
      - "app/home-asset-preview.tsx"
      - "app/home-role-selector.tsx"
      - "app/globals.css"
      - "app/layout.tsx"
      - "components/AppHeader.tsx"
      - "components/AppHeader.module.css"
      - "tests/responsive-foundation.test.mjs"
      - "tests/homepage-asset-register-hero.test.mjs"
      - "tests/desktop-site-viewport.test.mjs"
      - "tests/home-wide-static-layout.test.mjs"
      - "package.json"
      - ".github/workflows/home-responsive-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test Home responsive contract
        run: npm run test:homepage-responsive

      - name: Test wide static desktop composition
        run: node --test tests/home-wide-static-layout.test.mjs
