name: Owner App mobile navigation validation
on:
  pull_request:
    paths:
      - 'app/owner-app/**'
      - 'app/api/owner-app/**'
      - 'lib/owner-asset-location.ts'
      - 'lib/asset-activity.ts'
      - 'lib/owner-notification-inbox.ts'
      - 'lib/notification-copy.ts'
      - 'lib/notifications.ts'
      - 'lib/maintenance-reminders.ts'
      - 'lib/fuel-gauge.ts'
      - 'lib/asset-fuel-eligibility.ts'
      - 'tests/asset-fuel-eligibility.test.mjs'
      - 'app/field-manager/field-manager-diesel-client.tsx'
      - 'app/field-manager/assets/**/maintenance/field-manager-maintenance-client.tsx'
      - 'app/fuel-scan/**/fuel-scan-client.tsx'
      - 'tests/owner-top-navigation.test.mjs'
      - 'components/FuelLocationModal.tsx'
      - 'tests/owner-mobile-*.test.mjs'
      - 'tests/owner-app-operations.test.mjs'
      - 'tests/owner-app-petrol-station.test.mjs'
      - 'tests/app-umbrella-directory-access.test.mjs'
      - '.github/workflows/owner-mobile-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/owner-mobile-*.test.mjs tests/owner-top-navigation.test.mjs tests/owner-app-operations.test.mjs tests/owner-app-petrol-station.test.mjs tests/owner-app-share-parity.test.mjs tests/app-umbrella-directory-access.test.mjs tests/owner-register-access.test.mjs tests/asset-fuel-eligibility.test.mjs
