name: Asset tracking pilot
on:
  pull_request:
    paths: ['android/tracker/**', 'lib/asset-tracking*', 'app/api/tracking/**', 'app/api/asset-register/**/tracking/**', 'components/asset-register/Asset*Tracking*', 'components/asset-register/AssetMovementHistory*', 'tests/asset-tracking*', '.github/workflows/asset-tracking-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/asset-tracking*.test.mjs
      - run: npm run typecheck
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android/tracker :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aim4price-tracker-pilot-apk
          path: android/tracker/app/build/outputs/apk/debug/app-debug.apk
