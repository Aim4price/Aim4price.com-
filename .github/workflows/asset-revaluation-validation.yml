name: Asset revaluation validation
on:
  pull_request:
    paths:
      - 'lib/automatic-valuation-*.ts'
      - 'instrumentation.ts'
      - 'database/migrations/140-automatic-asset-valuations.sql'
      - 'lib/scan-assets.ts'
      - 'lib/scan-current-inputs.ts'
      - 'app/api/asset-register/revalue/route.ts'
      - 'tests/automatic-valuation*.test.cjs'
      - 'lib/asset-revaluation-save.ts'
      - 'lib/asset-register-revaluation.ts'
      - 'lib/asset-register-db.ts'
      - 'lib/asset-depreciation-timeline.ts'
      - 'lib/valuation-runs.ts'
      - 'lib/approved-value-baseline.ts'
      - 'tests/asset-revaluation-save.test.cjs'
      - 'tests/approved-value-baseline.test.cjs'
      - '.github/workflows/asset-revaluation-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-revaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/automatic-valuation.test.cjs tests/automatic-valuation-access.test.cjs tests/asset-revaluation-save.test.cjs tests/approved-value-baseline.test.cjs tests/asset-history.test.cjs tests/asset-saleability.test.cjs
