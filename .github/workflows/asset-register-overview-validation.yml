name: Asset Register overview validation

on:
  pull_request:
    paths:
      - "app/asset-register/page.tsx"
      - "app/asset-register/asset-register-overview.tsx"
      - "app/asset-register/asset-register-overview.module.css"
      - "tests/asset-register-overview.test.mjs"
      - ".github/workflows/asset-register-overview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-register-overview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test Asset Register overview
        run: node --test tests/asset-register-overview.test.mjs

      - name: Production build
        run: npm run build
