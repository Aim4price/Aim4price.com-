name: Read-only AI connection validation
on:
  pull_request:
    paths:
      - 'lib/ai-connection/**'
      - 'integrations/chatgpt/**'
      - 'public/ai/aim4price-plugin.png'
      - 'scripts/package-chatgpt.py'
      - 'tests/ai-publication.test.cjs'
      - 'tests/test_chatgpt_package.py'
      - 'app/api/ai/**'
      - 'app/account/ai-connect/**'
      - 'app/admin/ai-connect/**'
      - 'app/auth/auth-client.tsx'
      - 'components/AdminNavigation.tsx'
      - 'scripts/migrate-ai-connections.mjs'
      - 'scripts/verify-ai-connections.cjs'
      - 'database/migrations/137-ai-provider-admin-reporting.sql'
      - 'database/migrations/148-ongoing-owner-ai-connections.sql'
      - 'app/.well-known/**'
      - 'lib/external-share-permissions.ts'
      - 'lib/account-constants.ts'
      - 'middleware.ts'
      - 'database/migrations/135-read-only-ai-connections.sql'
      - 'tests/ai-connection.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-connection-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:ai-connection
      - run: node --test tests/ai-publication.test.cjs
      - run: python3 tests/test_chatgpt_package.py
      - run: npm run typecheck
      - run: node scripts/verify-ai-connections.cjs
