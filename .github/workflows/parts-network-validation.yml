name: Private parts network validation
on:
  pull_request:
    paths:
      - 'lib/parts-network*'
      - 'lib/dealer-app-access.ts'
      - 'app/parts/**'
      - 'app/dealer/parts/**'
      - 'app/api/parts-network/**'
      - 'app/dealer/page.tsx'
      - 'components/AppHeader.tsx'
      - 'app/auth/auth-client.tsx'
      - 'tests/parts-network.test.cjs'
      - 'scripts/verify-parts-network.cjs'
      - '.github/workflows/parts-network-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/parts-network.test.cjs tests/signup-wizard-flow.test.mjs tests/separate-app-sessions.test.mjs
      - run: node scripts/verify-parts-network.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-network-screenshots
          path: .next/parts-network-validation/*.png
