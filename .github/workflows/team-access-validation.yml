name: Desktop team access validation
on:
  pull_request:
    paths:
      - 'lib/team-*.ts'
      - 'lib/team-login.ts'
      - 'lib/team-register.ts'
      - 'app/asset-register/**'
      - 'scripts/verify-desktop-register.cjs'
      - 'app/api/team-*/**'
      - 'app/account/team-access/**'
      - 'app/team/**'
      - 'app/auth/**'
      - 'scripts/verify-sharing-usage.cjs'
      - 'components/team/**'
      - 'app/business/join/business-signup.tsx'
      - 'lib/auth-session.ts'
      - 'lib/external-share-permissions.ts'
      - 'database/migrations/143-desktop-team-access.sql'
      - 'database/migrations/144-owner-managed-desktop-logins.sql'
      - 'database/migrations/152-desktop-login-usernames.sql'
      - 'database/migrations/153-desktop-username-lookup.sql'
      - 'tests/team-access.test.cjs'
      - 'tests/team-account-access.test.cjs'
      - 'database/migrations/155-desktop-client-work.sql'
      - 'database/migrations/158-desktop-parts-stocklists.sql'
      - 'lib/team-write-guard.ts'
      - 'scripts/verify-team-access.cjs'
      - '.github/workflows/team-access-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/team-access.test.cjs tests/team-account-access.test.cjs tests/team-workspace-permissions.test.cjs tests/parts-network.test.cjs
      - run: node scripts/verify-team-access.cjs
      - run: node scripts/verify-sharing-usage.cjs
      - run: node scripts/verify-desktop-register.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-access-screenshots
          path: |
            .next/team-access-validation
            .next/desktop-validation
