name: Business network validation
on:
  pull_request:
    paths:
      - 'components/SignupFlow*'
      - 'lib/business-network*'
      - 'lib/sharing-foundation.ts'
      - 'tests/sharing-foundation.test.cjs'
      - 'app/shared-enquiries/**'
      - 'app/admin/sharing/**'
      - 'app/api/admin/sharing/**'
      - 'components/SharedEnquiryLive.tsx'
      - 'components/asset-register/ShareHistory*'
      - 'database/migrations/123-live-sharing-foundation.sql'
      - 'lib/business-workspaces.ts'
      - 'lib/account-entitlements.ts'
      - 'components/SharedEnquiryAccess.tsx'
      - 'tests/business-workspaces.test.cjs'
      - 'tests/basic-business-access.test.cjs'
      - 'tests/shared-account-page.test.cjs'
      - 'scripts/verify-free-business-access.cjs'
      - 'lib/retired-workspaces.ts'
      - 'database/migrations/120-retire-specialist-workspaces.sql'
      - 'tests/workspace-retirement.test.mjs'
      - 'lib/admin-business-network.ts'
      - 'lib/business-acceptances.ts'
      - 'lib/guest-*.ts'
      - 'lib/asset-share-links.ts'
      - 'lib/external-lead-access.ts'
      - 'lib/external-share-permissions.ts'
      - 'components/asset-register/ExternalAccessRequests.tsx'
      - 'database/migrations/116-external-share-access-requests.sql'
      - 'database/migrations/117-shared-report-formats.sql'
      - 'lib/lead-submissions.ts'
      - 'lib/dealer-asset-corrections.ts'
      - 'components/asset-register/ExternalLeadActions*'
      - 'app/business/**'
      - 'tests/external-share-permissions.test.cjs'
      - 'tests/invitation-report-handoff.test.cjs'
      - 'tests/partner-directory.test.cjs'
      - 'app/api/guest-access/**'
      - 'app/api/admin/guest-businesses/**'
      - 'app/api/asset-share-links/**'
      - 'app/admin/businesses/**'
      - 'app/asset-share/**'
      - 'components/asset-register/GuestLead*'
      - 'components/asset-register/AssetExternalShare.tsx'
      - 'components/asset-register/ShareDisclosure*'
      - 'components/asset-register/ShareDisclaimer*'
      - 'components/asset-register/SharedAssetCards.tsx'
      - 'database/migrations/112-directory-guest-leads.sql'
      - 'tests/guest-leads.test.cjs'
      - 'tests/guest-enquiry-credits.test.cjs'
      - 'components/GuestEnquiryAccess.tsx'
      - 'lib/access-email.ts'
      - 'database/migrations/118-guest-enquiry-credits.sql'
      - 'tests/asset-share-links.test.cjs'
      - 'scripts/verify-guest-leads.cjs'
      - 'lib/partner-access.ts'
      - 'lib/licence-share-readiness.ts'
      - 'components/asset-register/LicenceShareReview*'
      - 'lib/website-canvas.ts'
      - 'app/api/business-network/**'
      - 'app/api/asset-leads/route.ts'
      - 'app/api/partners/route.ts'
      - 'app/business-network/**'
      - 'components/business-network/**'
      - 'app/asset-register/asset-register-client.tsx'
      - 'app/owner-app/assets/**/owner-asset-options-client.tsx'
      - 'database/migrations/102-business-network.sql'
      - 'tests/business-network.test.mjs'
      - 'scripts/verify-business-network.cjs'
      - 'scripts/verify-business-admin-entry.cjs'
      - 'lib/trusted-request-origin.ts'
      - 'package*.json'
      - '.github/workflows/business-network-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: business-network-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/sharing-foundation.test.cjs tests/business-network.test.mjs tests/workspace-retirement.test.mjs tests/umbrella-lead-unbundling.test.mjs tests/guest-leads.test.cjs tests/guest-enquiry-credits.test.cjs tests/asset-share-links.test.cjs tests/business-acceptance-search.test.cjs tests/public-enquiry-flow.test.cjs tests/external-share-permissions.test.cjs tests/invitation-report-handoff.test.cjs tests/partner-directory.test.cjs tests/business-accounts.test.cjs tests/business-workspaces.test.cjs tests/basic-business-access.test.cjs tests/shared-account-page.test.cjs
      - run: node scripts/verify-business-network.cjs
      - run: node scripts/verify-guest-leads.cjs
      - run: node scripts/verify-business-admin-entry.cjs
      - run: node scripts/verify-free-business-access.cjs
