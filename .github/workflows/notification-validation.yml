name: Notification validation

on:
  pull_request:
    paths:
      - 'lib/push-*.ts'
      - 'lib/listing-alert*.ts'
      - 'lib/app-notification*.ts'
      - 'lib/owner-notification-inbox.ts'
      - 'lib/notification-delivery-plan.ts'
      - 'components/AppNotification*'
      - 'components/AppEnquiryDecision.tsx'
      - 'components/ListingAlertSettings*'
      - 'app/dealer/page.tsx'
      - 'app/middleman/page.tsx'
      - 'app/marketplace/marketplace-client.tsx'
      - 'lib/marketplace-db.ts'
      - 'tests/app-notification-expansion.test.cjs'
      - 'lib/notification-request-origin.ts'
      - 'lib/desktop-notification-access.ts'
      - 'components/NotificationSettingsModal*'
      - 'app/api/account/notifications/**'
      - 'app/middleman/notifications/**'
      - 'components/PhoneNotificationSettings*'
      - 'app/api/app-notifications/**'
      - 'public/*sw.js'
      - 'public/app-push-worker.js'
      - 'instrumentation.ts'
      - 'tests/phone-notifications.test.cjs'
      - 'app/api/notifications/**'
      - 'app/api/owner-app/notifications/**'
      - 'app/api/dealer/maintenance/notifications/**'
      - 'app/api/field-manager/notifications/**'
      - 'app/api/admin/users/**'
      - 'app/owner-app/notifications/**'
      - 'app/owner-app/owner-notifications-link.tsx'
      - 'app/dealer/notifications/**'
      - 'app/dealer/leads/**'
      - 'app/dealer/maintenance/**'
      - 'app/field-manager/notifications/**'
      - 'app/field-manager/field-manager-home-client.tsx'
      - 'app/account/**'
      - 'app/admin/admin-client.tsx'
      - 'app/admin/page.module.css'
      - 'app/admin/lifecycle-calculator/**'
      - 'lib/admin-lifecycle-calculator.ts'
      - 'tests/admin-lifecycle-calculator.test.mjs'
      - 'tests/admin-lifecycle-calculator.security.test.mjs'
      - 'app/tracking/**'
      - 'components/AppHeader.tsx'
      - 'components/AppHeader.module.css'
      - 'components/DealerMaintenancePagination.tsx'
      - 'lib/notification-inbox.ts'
      - 'lib/notifications.ts'
      - 'lib/admin-account-notifications.ts'
      - 'lib/app-notification-read-state.ts'
      - 'lib/dealer-maintenance-notification-inbox.ts'
      - 'lib/dealer-maintenance-initial-load.ts'
      - 'lib/field-manager-notifications.ts'
      - 'database/migrations/67-notification-inbox.sql'
      - 'database/migrations/68-app-notification-read-state.sql'
      - 'tests/notification-inbox.test.mjs'
      - 'tests/admin-account-notifications.test.mjs'
      - 'tests/notification-viewer-scope.test.mjs'
      - 'tests/dealer-fast-loading.test.mjs'
      - 'tests/dealer-maintenance-pagination.test.mjs'
      - 'tests/account-app-access-modal-flow.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test notification inbox
        run: npm run test:notifications

      - name: Test Dealer fast loading
        run: npm run test:dealer-fast-loading

      - name: Test app access modal flows
        run: npm run test:account-app-access

      - name: Test admin lifecycle calculator
        run: npm run test:lifecycle-calculator

      - name: Test Owner App operations
        run: npm run test:owner-app-operations


      - name: Validate phone notifications
        run: npm run test:phone-notifications

