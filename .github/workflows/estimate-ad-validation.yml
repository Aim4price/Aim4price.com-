name: Estimate photos and advert validation

on:
  pull_request:
    paths:
      - 'app/valuation/**'
      - 'lib/estimate-photo-handoff.ts'
      - 'lib/marketplace-ad-renderer.ts'
      - 'lib/advert-publication.ts'
      - 'lib/marketplace-db.ts'
      - 'app/api/ad-studio/publish/**'
      - 'components/AdvertCreator*'
      - 'components/AdvertShareSheet*'
      - 'components/FacebookAdvertActions*'
      - 'tests/advert-publication.test.cjs'
      - 'tests/estimate-ad-handoff.test.mjs'
      - 'tests/estimate-report-enhancement.test.mjs'
      - 'tests/ad-studio*.test.mjs'
      - '.github/workflows/estimate-ad-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estimate-ad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Photo handoff, PDF and JPEG regression tests
        run: node --experimental-strip-types --test tests/estimate-ad-handoff.test.mjs tests/estimate-report-enhancement.test.mjs tests/ad-studio.test.mjs tests/ad-studio-renderer.test.mjs
      - name: Advert creation and publication regression tests
        run: node --experimental-strip-types --test tests/advert-creator.test.mjs tests/advert-publication.test.cjs
      - run: npm run typecheck
