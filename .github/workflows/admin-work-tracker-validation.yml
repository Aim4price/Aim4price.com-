name: Admin work tracker validation

on:
  pull_request:
    paths:
      - '.github/workflows/admin-work-tracker-validation.yml'
      - 'app/admin/work-tracker/**'
      - 'app/api/admin/work-tracker/**'
      - 'components/AdminWorkTrackerBar*'
      - 'lib/admin-work-tracker*'
      - 'database/migrations/83-admin-work-tracker.sql'
      - 'tests/admin-work-tracker*'
      - 'app/layout.tsx'
      - 'app/admin/admin-client.tsx'
      - 'app/admin/page.module.css'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test Admin work tracker
        run: npm run test:admin-work-tracker

      - name: Test Admin accounts
        run: npm run test:admin-accounts

      - name: Test notifications
        run: npm run test:notifications
