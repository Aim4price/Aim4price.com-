name: Fuel Ledger validation

on:
  pull_request:
    paths:
      - 'lib/operational-asset.ts'
      - 'lib/fuel-scan-assets.ts'
      - 'tests/operational-asset-picker.test.mjs'
      - 'app/api/fuel/**'
      - 'app/api/fuel-scan/**'
      - 'app/fuel/**'
      - 'app/fuel-scan/**'
      - 'app/owner-app/operations/fuel/**'
      - 'lib/fuel-ledger.ts'
      - 'lib/fuel-report.ts'
      - 'lib/fuel-slip-export.ts'
      - 'components/ReportDownloadFlow.*'
      - 'scripts/verify-fuel-download-flow.cjs'
      - 'lib/fuel-work-*.ts'
      - 'components/FuelWorkField*'
      - 'tests/fuel-work-choices.test.cjs'
      - 'scripts/verify-fuel-work-choices.cjs'
      - 'database/migrations/**fuel**'
      - 'tests/fuel-*.test.mjs'
      - 'package.json'
      - '.github/workflows/fuel-ledger-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/operational-asset.ts'
      - 'lib/fuel-scan-assets.ts'
      - 'tests/operational-asset-picker.test.mjs'
      - 'app/api/fuel/**'
      - 'app/api/fuel-scan/**'
      - 'app/fuel/**'
      - 'app/fuel-scan/**'
      - 'app/owner-app/operations/fuel/**'
      - 'lib/fuel-ledger.ts'
      - 'lib/fuel-report.ts'
      - 'lib/fuel-slip-export.ts'
      - 'components/ReportDownloadFlow.*'
      - 'scripts/verify-fuel-download-flow.cjs'
      - 'lib/fuel-work-*.ts'
      - 'components/FuelWorkField*'
      - 'tests/fuel-work-choices.test.cjs'
      - 'scripts/verify-fuel-work-choices.cjs'
      - 'database/migrations/**fuel**'
      - 'tests/fuel-*.test.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: |
          node --test tests/operational-asset-picker.test.mjs
          npm run test:fuel-ledger
      - run: node --test tests/fuel-work-choices.test.cjs
      - run: node scripts/verify-fuel-work-choices.cjs
      - run: node scripts/verify-fuel-download-flow.cjs
