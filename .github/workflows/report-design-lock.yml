name: Report design lock

on:
  pull_request:
    paths:
      - 'app/api/**/report/**'
      - 'app/api/asset-register/export/**'
      - 'app/asset-register/asset-register-client.tsx'
      - 'app/maintenance/maintenance-client.tsx'
      - 'app/my-invoices/my-invoices-client.tsx'
      - 'app/owner-app/**/owner-asset-report-picker.tsx'
      - 'components/*ReportModal.tsx'
      - 'components/ReportDownloadFlow.*'
      - 'lib/*report*.ts'
      - 'lib/retired-workspaces.ts'
      - 'tests/workspace-retirement.test.mjs'
      - 'lib/simple-xlsx.ts'
      - 'lib/fuel-slip-export.ts'
      - 'app/api/fuel/slips/export/**'
      - 'tests/*report*.test.mjs'
      - 'tests/*report*.test.cjs'
      - 'tests/fuel-slip-export.test.mjs'
      - 'scripts/verify-report-suite.cjs'
      - 'docs/report-design-contract.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/report-design-lock.yml'
  push:
    branches:
      - main
    paths:
      - 'app/api/**/report/**'
      - 'app/api/asset-register/export/**'
      - 'app/asset-register/asset-register-client.tsx'
      - 'app/maintenance/maintenance-client.tsx'
      - 'app/my-invoices/my-invoices-client.tsx'
      - 'app/owner-app/**/owner-asset-report-picker.tsx'
      - 'components/*ReportModal.tsx'
      - 'components/ReportDownloadFlow.*'
      - 'lib/*report*.ts'
      - 'lib/retired-workspaces.ts'
      - 'tests/workspace-retirement.test.mjs'
      - 'lib/simple-xlsx.ts'
      - 'lib/fuel-slip-export.ts'
      - 'app/api/fuel/slips/export/**'
      - 'tests/*report*.test.mjs'
      - 'tests/*report*.test.cjs'
      - 'tests/fuel-slip-export.test.mjs'
      - 'scripts/verify-report-suite.cjs'
      - 'docs/report-design-contract.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/report-design-lock.yml'

permissions:
  contents: read

jobs:
  approved-report-design:
    name: Approved report design
    # Keep PDF tooling stable across ubuntu-latest image rollouts.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify locked report design
        run: npm run test:report-design

      - name: Verify report access and opening regressions
        run: node --experimental-strip-types --test tests/app-account-isolation.test.mjs tests/asset-register-summary-export.test.mjs tests/rich-report-template-parity.test.mjs tests/asset-map-report.test.mjs tests/report-branding.test.mjs

      - name: Verify workspace retirement boundaries
        run: npm run test:workspace-retirement

      # Avoid Ubuntu mirrors: repeated runner DNS failures blocked PDF validation.
      - name: Install PDF inspection tools
        uses: mamba-org/setup-micromamba@v3
        timeout-minutes: 5
        with:
          environment-name: report-tools
          create-args: >-
            --override-channels -c conda-forge
            poppler=24.08.0
          init-shell: none
          cache-environment: true

      - name: Verify PDF inspection tools
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          pdftotext -v
          pdftoppm -v

      - name: Verify report templates and print layouts
        shell: micromamba-shell {0}
        run: node scripts/verify-report-suite.cjs

      - name: Verify valuation PDF clarity
        shell: micromamba-shell {0}
        run: node scripts/verify-valuation-report-clarity.cjs

      - name: Upload synthetic report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-suite-evidence
          path: report-evidence/
          if-no-files-found: warn

  report-bundle:
    name: Report production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile production bundle
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/report-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -eq 0 ]; then exit 0; fi
          # Same deployment-DB-only guard as the existing canvas workflow.
          if grep -Fq "✓ Compiled successfully" /tmp/report-build.log \
            && grep -Fq "Database connection variables are missing" /tmp/report-build.log \
            && grep -Fq "Collecting page data" /tmp/report-build.log \
            && grep -Eq "Failed to collect page data for /api/dealer/[^[:space:]]+" /tmp/report-build.log; then
            echo "Bundle compiled; page-data collection requires deployment database credentials."
            exit 0
          fi
          exit "$build_status"
