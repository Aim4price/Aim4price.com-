name: Website header and zoom validation

on:
  pull_request:
    paths:
      - 'components/AppHeader*'
      - 'components/AppPatternBackground*'
      - 'components/SiteWorkspaceZoom*'
      - 'lib/website-canvas.ts'
      - 'app/home-hero-experience.tsx'
      - 'lib/home-story-swipe.ts'
      - 'tests/home-story-swipe.test.mjs'
      - 'tests/site-workspace-zoom.test.mjs'
      - 'scripts/verify-website-canvas.cjs'
      - '.github/workflows/website-header-zoom-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-header-zoom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Website layout regressions
        run: node --test tests/site-workspace-zoom.test.mjs tests/header-manage-layout.test.mjs
      - name: Homepage swipe regressions
        run: node --experimental-strip-types --test tests/home-story-swipe.test.mjs tests/homepage-asset-register-hero.test.mjs
      - run: npm run typecheck
      - name: Production bundle validation
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/website-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -eq 0 ]; then exit 0; fi
          # Same narrowly defined missing-database stop as the existing PR workflows.
          if grep -Fq "✓ Compiled successfully" /tmp/website-build.log \
            && grep -Fq "Database connection variables are missing" /tmp/website-build.log \
            && grep -Fq "Failed to collect page data for /api/dealer/session" /tmp/website-build.log; then
            echo "Bundle compiled; page-data collection requires deployment database credentials."
            exit 0
          fi
          exit "$build_status"


